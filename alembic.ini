# Trechos alterados com apoio de IA (Claude Code) e revisados pelo autor.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# O banco não fica fixo aqui: migrations/env.py usa DATABASE_URL (ambiente ou .env), como a API e o seed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
